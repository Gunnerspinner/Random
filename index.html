<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lounge</title>
  <style>
    :root {
      --bg-servers: #1e1f22;
      --bg-sidebar: #2b2d31;
      --bg-chat: #313338;
      --bg-input: #383a40;
      --text-main: #dbdee1;
      --text-muted: #949ba4;
      --blurple: #5865f2;
      --blurple-hover: #4752c4;
      /* Custom blue accent variable for nickname text clarity */
      --text-blue: #00b0f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      background-color: var(--bg-chat);
      color: var(--text-main);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Left Server List Bar */
    .server-list {
      width: 72px;
      background-color: var(--bg-servers);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      gap: 8px;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      background-color: var(--bg-chat);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--blurple);
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .server-icon:hover, .server-icon.active {
      border-radius: 16px;
      background-color: var(--blurple);
      color: white;
    }

    /* Sidebar Channel Column - Widened to 280px to prevent cramped text elements */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar-header {
      height: 48px;
      border-bottom: 1px solid #1f2023;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
    }

    .channel-list {
      padding: 8px;
      flex-grow: 1;
    }

    .channel-item {
      padding: 6px 8px;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      margin-bottom: 2px;
      font-size: 15px;
    }

    .channel-item::before {
      content: "#";
      margin-right: 6px;
      font-size: 20px;
    }

    .channel-item.active, .channel-item:hover {
      background-color: rgba(78, 80, 88, 0.3);
      color: var(--text-main);
    }

    /* Profile Panel */
    .user-profile-panel {
      height: 52px;
      background-color: #232428;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--blurple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .profile-input-box {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .profile-input-box label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: bold;
    }

    /* Target identity display input colored custom blue */
    .profile-input-box input {
      background: transparent;
      border: none;
      color: var(--text-blue);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    /* Main Chat Section */
    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-chat);
    }

    .chat-header {
      height: 48px;
      border-bottom: 1px solid #26272b;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
    }

    .chat-header::before {
      content: "#";
      color: var(--text-muted);
      margin-right: 8px;
      font-size: 24px;
    }

    /* Container matching your targeted loop styling rule */
    #fbMessages {
      flex-grow: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* The target class matches your literal script layout */
    .msg {
      word-break: break-word;
      font-size: 15px;
      line-height: 1.4;
      color: var(--text-main);
    }

    .chat-input-wrapper {
      padding: 0 16px 24px 16px;
    }

    .input-container {
      background-color: var(--bg-input);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
    }

    .input-container input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      width: 100%;
      font-size: 15px;
    }

    .input-container input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background-color: var(--blurple);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }

    .send-btn:hover {
      background-color: var(--blurple-hover);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #2e3035;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="server-list">
      <div class="server-icon active">L</div>
    </div>

    <div class="sidebar">
      <div>
        <div class="sidebar-header">The Lounge</div>
        <div class="channel-list">
          <div class="channel-item active">general</div>
        </div>
      </div>
      
      <div class="user-profile-panel">
        <div class="avatar" id="avatarIcon">U</div>
        <div class="profile-input-box">
          <label for="fbName">My Nickname</label>
          <input type="text" id="fbName" value="User" placeholder="Change name..." oninput="updateAvatarIcon(this.value)">
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">general</div>
      
      <!-- Your explicit target container -->
      <div id="fbMessages"></div>

      <div class="chat-input-wrapper">
        <div class="input-container">
          <input type="text" id="fbInput" placeholder="Message #general" onkeydown="if(event.key === 'Enter') window.sendFB()">
          <button class="send-btn" onclick="window.sendFB()">Send</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Your code block restored exactly -->
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const app=initializeApp({
    apiKey:"AIzaSyCPLk7btD2izv-d0u8GrlQV2VIwphrSkMU",
    databaseURL:"https://galaxia-chat-servers-2-default-rtdb.firebaseio.com"
  });
  const db=getDatabase(app);
  const chatRef=ref(db,"messages");

  onValue(chatRef,s=>{
    fbMessages.innerHTML="";
    s.forEach(c=>{
      const m=c.val();
      fbMessages.innerHTML+=`<div class="msg">${m.user}: ${m.text}</div>`;
    });
    fbMessages.scrollTop=fbMessages.scrollHeight;
  });

  window.sendFB=()=>{
    if(!fbInput.value)return;
    push(chatRef,{user:fbName.value||"User",text:fbInput.value});
    fbInput.value="";
  };
  </script>

  <script>
    function updateAvatarIcon(val) {
      const icon = document.getElementById('avatarIcon');
      icon.innerText = val.trim() ? val.trim().charAt(0).toUpperCase() : 'U';
    }
  </script>
</body>
</html>
